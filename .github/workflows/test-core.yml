# Tests the checker, schemas and sandbox film whenever they change.
# Actions are pinned to full commit SHAs (the repo is public).

name: Test core

on:
  push:
    branches: [main]
    paths: ["core/**", "spec/**", "films/00/**", ".github/workflows/test-core.yml"]
  pull_request:
    paths: ["core/**", "spec/**", "films/00/**", ".github/workflows/test-core.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --quiet -e "./core[dev]"
      - name: Test
        run: python -m pytest core -q
