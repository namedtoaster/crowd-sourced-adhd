[project]
name = "adhd-core"
version = "0.1.0"
description = "Checks every Crowd-Sourced ADHD submission goes through, plus the adhd CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Pure Python only. This package is vendored into the Blender add-on, so no
# compiled dependencies (no Pillow, no numpy, no rpds-py via jsonschema).
dependencies = ["fastjsonschema>=2.19"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
adhd = "adhd_core.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adhd_core"]

# The schemas live once, in the repo's spec/ folder. Wheels carry a copy.
[tool.hatch.build.targets.wheel.force-include]
"../spec/slot.schema.json" = "adhd_core/spec/slot.schema.json"
"../spec/submission.schema.json" = "adhd_core/spec/submission.schema.json"
"../spec/check-result.schema.json" = "adhd_core/spec/check-result.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
